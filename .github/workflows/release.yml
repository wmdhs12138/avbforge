name: Release — Build & Publish AVBForge APK

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust (aarch64-linux-android)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Configure Android SDK & NDK + install cargo-ndk
        run: |
          NDK_DIR="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          if [ -z "$NDK_DIR" ] || [ ! -d "$NDK_DIR" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;27.2.12479018"
            NDK_DIR="$ANDROID_HOME/ndk/27.2.12479018"
          fi
          echo "ANDROID_NDK_HOME=$NDK_DIR" >> "$GITHUB_ENV"
          cargo install cargo-ndk --locked

      - name: Build aarch64 Rust core
        working-directory: rust-core
        run: |
          cargo ndk -t arm64-v8a --platform 31 build --release --bin avbforge-core
          mkdir -p ../android-app/app/src/main/jniLibs/arm64-v8a
          cp target/aarch64-linux-android/release/avbforge-core \
             ../android-app/app/src/main/jniLibs/arm64-v8a/libavbforge_core.so

      - name: Decode Release Keystore (if configured in Secrets)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > /tmp/release.jks
            echo "RELEASE_KEYSTORE_PATH=/tmp/release.jks" >> "$GITHUB_ENV"
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Build Release APK (falls back to debug-signed if Secrets unset)
        working-directory: android-app
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle :app:assembleRelease

      - name: Prepare Release Assets & SHA-256
        run: |
          mkdir -p dist
          cp android-app/app/build/outputs/apk/release/*.apk dist/AVBForge-arm64-v8a.apk
          cp rust-core/target/aarch64-linux-android/release/avbforge-core dist/avbforge-core-aarch64
          (cd dist && sha256sum * > SHA256SUMS.txt)

      - name: Upload Release Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AVBForge-release-dist
          path: dist/*

      - name: Publish GitHub Release (on Tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
