[workspace]
resolver = "2"
members = [
    "crates/avb2",
    "crates/bootimg",
    "crates/cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
hex = "0.4"
sha1 = "0.10"
sha2 = "0.10"
rsa = { version = "0.9", features = ["sha2", "pem"] }
pkcs8 = { version = "0.10", features = ["pem", "encryption", "std"] }
rand = "0.8"
rayon = "1.10"
lz4_flex = "0.11"
flate2 = "1.0"
lzma-rs = "0.3"
clap = { version = "4.5", features = ["derive"] }
tempfile = "3.14"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
